version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      aspire:
        patterns: ["Aspire.*"]
      dotnet:
        patterns: ["Microsoft.*", "Npgsql.*", "EFCore.*"]
  - package-ecosystem: npm
    directory: /src/Afterclass.Web
    schedule:
      interval: weekly
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
